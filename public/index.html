<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Silo</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Silo">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f6f7f6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Onest:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/app.css">
  <script>
    try { const t = localStorage.getItem('kb-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    // Цвет строки состояния / панели браузера — под выбранную тему
    (function () {
      const meta = document.querySelector('meta[name="theme-color"]');
      const dark = matchMedia('(prefers-color-scheme: dark)');
      window.syncThemeColor = function () {
        const t = document.documentElement.dataset.theme || (dark.matches ? 'dark' : 'light');
        meta.content = t === 'dark' ? '#131715' : '#f6f7f6';
      };
      syncThemeColor();
      if (dark.addEventListener) dark.addEventListener('change', syncThemeColor);
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="toasts" aria-live="polite"></div>
  <script src="/vault.js"></script>
  <script src="/app.js"></script>
</body>
</html>
